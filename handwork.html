<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Handmade objects by Şule Nur Kaya — felt, wool, and materials shaped by hand.">
  <title>Handwork | Sukaleyan</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --burgundy: #891e19;
      --gold: #ffb422;
      --white: #ffffff;
      --text-dark: #333333;
    }

    body {
      font-family: 'Mulish', sans-serif;
      font-weight: 400;
      line-height: 1.7;
      color: var(--text-dark);
      background-color: var(--white);
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--burgundy);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--burgundy);
      margin-bottom: 1.5rem;
      text-transform: lowercase;
    }

    .intro {
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .coming {
      background-color: var(--gold);
      color: var(--text-dark);
      padding: 2rem;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="container">
    <a href="/" class="back">&larr; back</a>

    <h1>handwork</h1>

    <p class="intro">Objects made by hand — felt, wool, and other materials shaped slowly, layer by layer. Work inspired by the same curiosity that drives everything else here.</p>

    <div class="coming">
      Coming soon.
    </div>
  </main>

</body>
</html>
