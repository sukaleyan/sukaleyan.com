<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Handmade objects by Şule Nur Kaya — felt, wool, and materials shaped by hand.">
  <title>Handwork | Sukaleyan</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Laqonic';
      src: url('fonts/Laqonic4FUnicase-Light.woff2') format('woff2'),
           url('fonts/Laqonic4FUnicase-Light.woff') format('woff');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --burgundy: #891e19;
      --gold: #ffb422;
      --white: #ffffff;
      --text-dark: #333333;
      --text-light: #666666;
      --border: #e5e5e5;
    }

    body {
      font-family: 'Mulish', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      line-height: 1.7;
      color: var(--text-dark);
      background-color: var(--gold);
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem;
      background-color: var(--white);
      min-height: 100vh;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back {
      color: var(--burgundy);
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    .back:hover {
      opacity: 0.7;
    }

    /* Mini Nav */
    .mini-nav {
      display: flex;
      gap: 0.5rem;
    }

    .mini-nav__item {
      width: 12px;
      height: 12px;
      display: block;
      position: relative;
    }

    .mini-nav__item--runic { background-color: var(--burgundy); }
    .mini-nav__item--stw { background-color: #5f8415; }
    .mini-nav__item--traces { background-color: #2b3249; }
    .mini-nav__item--handwork { background-color: var(--gold); }

    .mini-nav__label {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.5rem;
      font-family: 'Mulish', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .mini-nav__item:hover .mini-nav__label {
      opacity: 1;
      transform: translateY(0);
    }

    .mini-nav__item:hover {
      transform: scale(1.2);
      transition: transform 0.15s ease;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header__title {
      font-family: 'Laqonic', sans-serif;
      font-size: 3rem;
      font-weight: 300;
      color: var(--burgundy);
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    .header__intro {
      font-size: 1.05rem;
      color: var(--text-light);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .coming {
      background-color: var(--gold);
      color: var(--text-dark);
      padding: 3rem 2rem;
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      font-style: italic;
      max-width: 400px;
      margin: 0 auto;
    }

    .footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
    }

    @media (max-width: 800px) {
      body {
        background-color: var(--white);
      }

      .container {
        padding: 2rem 1.5rem;
      }

      .header__title {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="top-bar">
      <a href="/" class="back">&larr; back</a>
      <nav class="mini-nav">
        <a href="https://runicgrapes.com" target="_blank" rel="noopener" class="mini-nav__item mini-nav__item--runic"><span class="mini-nav__label">runic grapes</span></a>
        <a href="https://runicgrapes.com/spot-the-wine.html" target="_blank" rel="noopener" class="mini-nav__item mini-nav__item--stw"><span class="mini-nav__label">spot the wine</span></a>
        <a href="traces.html" class="mini-nav__item mini-nav__item--traces"><span class="mini-nav__label">traces</span></a>
        <a href="handwork.html" class="mini-nav__item mini-nav__item--handwork"><span class="mini-nav__label">handwork</span></a>
      </nav>
    </div>

    <header class="header">
      <h1 class="header__title">handwork</h1>
      <p class="header__intro">Objects made by hand — felt, wool, and other materials shaped slowly, layer by layer. Work inspired by the same curiosity that drives everything else here.</p>
    </header>

    <div class="coming">
      Coming soon.
    </div>

    <footer class="footer">
      &copy; 2026 Sukaleyan
    </footer>
  </main>

</body>
</html>
